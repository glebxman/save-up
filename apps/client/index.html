<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <meta name="theme-color" content="#000000" />
    <meta
      name="apple-mobile-web-app-capable"
      content="yes"
    />
    <title>Save up</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root" theme="light"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      (() => {
        const getDeviceFamily = (platform) => {
          const normalizedPlatform = (platform || "").toLowerCase();
          if (normalizedPlatform.includes("ios")) return "ios";
          if (normalizedPlatform.includes("android")) return "android";

          const userAgent = navigator.userAgent.toLowerCase();
          if (/iphone|ipad|ipod/.test(userAgent)) return "ios";
          if (userAgent.includes("android")) return "android";

          return navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1
            ? "ios"
            : "default";
        };

        const tg = window.Telegram?.WebApp;
        const root = document.documentElement;
        const isTechAdminRoute = window.location.pathname.startsWith("/tech-admin");
        const deviceFamily = getDeviceFamily(tg?.platform);
        const safeTopFallback =
          "var(--tg-content-safe-area-inset-top, var(--tg-safe-area-inset-top, env(safe-area-inset-top, 0px)))";
        const safeBottomFallback =
          "var(--tg-content-safe-area-inset-bottom, var(--tg-safe-area-inset-bottom, env(safe-area-inset-bottom, 0px)))";

        root.dataset.deviceFamily = deviceFamily;
        root.style.setProperty("--telegram-safe-top", safeTopFallback);
        root.style.setProperty("--telegram-safe-bottom", safeBottomFallback);

        if (isTechAdminRoute) {
          root.style.setProperty("--device-top-extra", "0px");
          root.style.setProperty("--app-top-padding", "0px");
        } else {
          if (deviceFamily === "ios") {
            root.style.setProperty("--device-top-extra", "calc(2.5rem + 14px)");
          } else if (deviceFamily === "android") {
            root.style.setProperty("--device-top-extra", "calc(1.5rem + 4px)");
          } else {
            root.style.setProperty("--device-top-extra", "1rem");
          }

          root.style.setProperty(
            "--app-top-padding",
            "max(1.5rem, calc(var(--telegram-safe-top) + var(--device-top-extra)))",
          );
        }

        if (tg) {
          try {
            tg.ready();
            tg.expand();

            const version = Number.parseFloat(tg.version || "0");
            if (Number.isFinite(version) && version >= 8 && typeof tg.requestFullscreen === "function") {
              tg.requestFullscreen();
            }

            if (Number.isFinite(version) && version >= 7.7 && typeof tg.disableVerticalSwipes === "function") {
              tg.disableVerticalSwipes();
            }

            if (Number.isFinite(version) && version >= 8 && typeof tg.lockOrientation === "function") {
              tg.lockOrientation("portrait");
            }
          } catch {
            // Ignore Telegram WebApp fullscreen/orientation errors.
          }
        }
      })();
    </script>
  </body>
</html>
